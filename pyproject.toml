[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nodecheck"
version = "0.1.0"
description = "Read-only Linux host health snapshots and troubleshooting reports"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "nodecheck contributors" }]
keywords = ["linux", "health-check", "troubleshooting", "cli"]
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.scripts]
nodecheck = "nodecheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
